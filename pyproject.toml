[project]
name = "united-board-accessment"
version = "0.1.0"
description = "For United Board Interview Assessment"
readme = "README.md"
authors = [
    { name = "Nyein Chan Soe", email = "nyeinchansoe.business@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
]

[project.scripts]
united-board-accessment = "united_board_accessment:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
